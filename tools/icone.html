<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Monograma BF</title>
<style>
  @font-face {
    font-family: "Zilla Slab";
    src: url("../docs/assets/fontes/zilla700.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* O ícone ocupa a janela inteira: o tamanho da captura define o
     tamanho do arquivo, e o desenho acompanha em unidades relativas
     à viewport. Assim o mesmo HTML serve para 512 e para 32. */
  .icone {
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
    background: #E1251B;
    font-family: "Zilla Slab", Georgia, serif;
    font-weight: 700;
  }
  body.redondo .icone { border-radius: 18.75vw; }   /* 96/512 */

  .bf {
    /* Branco, não amarelo: sobre o vermelho o branco rende 4,7:1
       contra 3:1 do amarelo. A 16px essa diferença decide se o
       monograma se lê ou vira mancha. */
    color: #fff;
    font-size: 52.3vw;            /* 268/512 */
    line-height: 1;
    letter-spacing: -.055em;
    /* Centro óptico, não geométrico: o F termina em vazio no canto
       inferior direito, então a mancha das duas letras pesa para a
       esquerda e para baixo. O deslocamento devolve o equilíbrio. */
    transform: translate(.018em, -.028em);
  }
</style>
</head>
<body>
  <div class="icone"><span class="bf">BF</span></div>
  <script>
    // ?so=redondo desenha o cantos arredondados do apple-touch-icon
    if (new URLSearchParams(location.search).get("so") === "redondo") {
      document.body.classList.add("redondo");
    }
  </script>
</body>
</html>
