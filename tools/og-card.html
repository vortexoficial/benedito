<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Manrope; src: url("../site/assets/fontes/manrope.woff2") format("woff2"); }
  @font-face { font-family: Zilla; src: url("../site/assets/fontes/zilla700.woff2") format("woff2"); font-weight: 700; }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    color: #fff;
    background: #5b0d12;
    font-family: Manrope, Arial, sans-serif;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 18px;
    background: #e1251b;
    border-bottom: 6px solid #ffc800;
  }
  .linhas {
    position: absolute;
    inset: 78px 0 auto 0;
    height: 170px;
    opacity: .13;
    background: repeating-linear-gradient(0deg, transparent 0 21px, #fff 22px 23px);
  }
  .conteudo {
    position: relative;
    z-index: 2;
    width: 690px;
    height: 100%;
    padding: 72px 0 54px 76px;
    display: flex;
    flex-direction: column;
  }
  .oficial {
    align-self: flex-start;
    margin: 0 0 24px;
    padding: 9px 15px;
    border: 1px solid rgba(255,255,255,.5);
    color: #ffc800;
    font-size: 15px;
    font-weight: 800;
    line-height: 1;
    text-transform: uppercase;
  }
  h1 {
    max-width: 650px;
    margin: 0;
    font-family: Zilla, Georgia, serif;
    font-size: 88px;
    line-height: .86;
    letter-spacing: 0;
  }
  h1 span { color: #ffc800; }
  .funcao {
    max-width: 560px;
    margin: 28px 0 0;
    font-size: 23px;
    font-weight: 650;
    line-height: 1.4;
  }
  .dados {
    display: flex;
    gap: 24px;
    margin: auto 0 0;
  }
  .dado {
    min-width: 126px;
    padding-left: 14px;
    border-left: 4px solid #ffc800;
  }
  .dado b {
    display: block;
    font-family: Zilla, Georgia, serif;
    font-size: 32px;
    line-height: .9;
  }
  .dado span {
    display: block;
    margin-top: 7px;
    color: rgba(255,255,255,.78);
    font-size: 12px;
    font-weight: 750;
    line-height: 1.25;
    text-transform: uppercase;
  }
  .retrato {
    position: absolute;
    z-index: 1;
    right: -18px;
    bottom: -136px;
    width: 635px;
    height: auto;
  }
  .marca {
    position: absolute;
    z-index: 3;
    right: 38px;
    bottom: 28px;
    padding: 9px 13px;
    color: #5b0d12;
    background: #ffc800;
    font-size: 13px;
    font-weight: 850;
  }
</style>
</head>
<body>
  <div class="linhas" aria-hidden="true"></div>
  <main class="conteudo">
    <p class="oficial">Site oficial</p>
    <h1>Benedito<br><span>Furtado</span></h1>
    <p class="funcao">Jornalista, escritor e vereador de Santos</p>
    <div class="dados">
      <div class="dado"><b>9º</b><span>mandato</span></div>
      <div class="dado"><b>32</b><span>leis pelos animais</span></div>
      <div class="dado"><b>7</b><span>livros publicados</span></div>
    </div>
  </main>
  <img class="retrato" src="../site/assets/img/benedito-atualizado.webp" alt="">
  <div class="marca">beneditofurtado.com.br</div>
</body>
</html>
