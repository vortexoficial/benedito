# DESLIGADO — não roda no push.
#
# O GitHub Actions está bloqueado nesta conta por questão de cobrança
# ("your account is locked due to a billing issue"), então toda execução
# falharia e encheria o histórico de erro vermelho.
#
# Enquanto isso, o site publica pelo build interno do Pages, direto da
# pasta docs/ no branch main. Não depende do Actions.
#
# Este arquivo fica guardado porque o caminho é bom: resolvida a cobrança,
# basta descomentar o gatilho de push abaixo e mudar a origem do Pages
# para "GitHub Actions". Aí o build passa a rodar no servidor e ninguém
# precisa mais lembrar de rodar o build antes de commitar.

name: Publicar no GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:        # só manual, enquanto o Actions estiver bloqueado

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Se dois pushes chegarem juntos, o segundo
# espera em vez de disputar com o primeiro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar o site
        run: node construir.js

      - name: Conferir que o build saiu íntegro
        run: |
          test -f docs/index.html || { echo "index.html não foi gerado"; exit 1; }
          test -f docs/CNAME     || { echo "CNAME não foi gerado"; exit 1; }
          test -f docs/.nojekyll || { echo ".nojekyll não foi gerado"; exit 1; }
          echo "arquivos em docs/: $(find docs -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
