# Publica o site no GitHub Pages a cada push na main.
#
# O build roda aqui, no servidor do GitHub, e não depende de ninguém
# lembrar de rodar `node construir.js` antes de commitar: o que vai
# para o ar é sempre gerado a partir do que está no repositório.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite publicar manualmente pelo painel do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Se dois pushes chegarem juntos, o segundo
# espera em vez de disputar com o primeiro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar o site
        run: node construir.js

      - name: Conferir que o build saiu íntegro
        run: |
          test -f site/index.html || { echo "index.html não foi gerado"; exit 1; }
          test -f site/CNAME     || { echo "CNAME não foi gerado"; exit 1; }
          test -f site/.nojekyll || { echo ".nojekyll não foi gerado"; exit 1; }
          echo "arquivos em site/: $(find site -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
